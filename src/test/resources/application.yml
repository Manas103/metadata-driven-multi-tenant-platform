# Test / measurement profile: an in-memory H2 database in PostgreSQL compatibility mode.
# No real PostgreSQL is reachable in this build environment.
spring:
  datasource:
    url: jdbc:h2:mem:metaplatform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

logging:
  level:
    com.manas.metaplatform: INFO
