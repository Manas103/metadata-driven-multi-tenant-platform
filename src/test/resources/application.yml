# Test / measurement profile: an in-memory H2 database in PostgreSQL compatibility mode,
# schema created from the entities. The same tests run against real PostgreSQL 16 with
# -Dspring.profiles.active=pg (application-pg.yml); ProductionSchemaTest additionally runs
# the Flyway migration and Hibernate's validate step there.
spring:
  datasource:
    url: jdbc:h2:mem:metaplatform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  error:
    include-message: always

logging:
  level:
    com.manas.metaplatform: INFO
