# Production profile: real PostgreSQL. Flyway applies src/main/resources/db/migration, then
# Hibernate validates the entities against it. Every connection setting can be overridden
# by environment variables (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD); the container and the AWS task set them.
spring:
  application:
    name: metadata-driven-multi-tenant-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/metaplatform
    username: metaplatform_app
    password: ${METAPLATFORM_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# seed the synthetic demo tenants and ledger into an empty database (DemoDataLoader)
platform:
  demo-data: false

logging:
  level:
    com.manas.metaplatform: INFO
